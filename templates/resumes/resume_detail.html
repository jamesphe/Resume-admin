{% extends "base.html" %}

{% block content %}
<h2>{{ resume.title }}</h2>
<div class="resume-detail">
    <p>上传时间：{{ resume.uploaded_at }}</p>
    <p>状态：{{ resume.get_status_display }}</p>
    {% if resume.analysis %}
    <div class="analysis">
        <h3>AI分析报告</h3>
        {{ resume.analysis.analysis_text|linebreaks }}
    </div>
    {% endif %}
</div>
{% endblock %}
