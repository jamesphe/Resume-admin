{% extends "base.html" %}

{% block content %}
<h2>简历列表</h2>
<div class="resume-list">
    {% for resume in resumes %}
    <div class="resume-item">
        <h3>{{ resume.title }}</h3>
        <p>上传时间：{{ resume.uploaded_at }}</p>
        <p>状态：{{ resume.get_status_display }}</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
